[package]
name = "mtgjson-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for MTGJSON — query Magic: The Gathering card data via DuckDB"
authors = ["Zachary Halpern", "Robert Pratt"]
repository = "https://github.com/mtgjson/mtgjson-sdk-rust"
homepage = "https://mtgjson.com"
readme = "README.md"
keywords = ["mtg", "magic-the-gathering", "mtgjson", "duckdb", "trading-cards"]
categories = ["api-bindings", "database"]

[features]
default = ["bundled"]
async = ["dep:tokio"]
bundled = ["duckdb/bundled"]
polars = ["duckdb/polars", "dep:polars"]

[dependencies]
duckdb = { version = "1.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json", "gzip"] }
flate2 = "1.1"
dirs = "6.0"
thiserror = "2.0"
rand = "0.10"
tempfile = "3.0"
tokio = { version = "1", features = ["rt"], optional = true }
polars = { version = "0.53", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3.0"
serde_json = "1.0"
